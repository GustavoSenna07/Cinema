version: '3.8'

services:
  postgres:
    image: bitnami/postgresql:latest
    container_name: cinema-postgres
    ports: 
      - '5432:5432'
    environment:
      - POSTGRES_USER=cinema
      - POSTGRES_PASSWORD=cinema123
      - POSTGRES_DB=cinema_lendas
    volumes:
      - cinema_pg_data:/bitnami/postgresql

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-cinema
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  cinema_pg_data:
